<!DOCTYPE html>
<html lang="es-MX">
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}</style></head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<script src="../js/art.js"></script>
<script src="../js/sprites.js"></script>
<script>
/* imagen Open Graph SIN spoilers: el retrato a medio armar, comido por la niebla */
const ctx = document.getElementById('og').getContext('2d');
const W = 1200, H = 630;
const rnd = G.Art.mulberry(7);
const grad = ctx.createLinearGradient(0, 0, 0, H);
grad.addColorStop(0, '#0b1437'); grad.addColorStop(1, '#1b2a5e');
ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
const af = G.Art.vortexAngle([
  { x: W * 0.62, y: H * 0.22, r: 130, s: 1 },
  { x: W * 0.88, y: H * 0.6, r: 110, s: -1 },
  { x: W * 0.3, y: H * 0.85, r: 120, s: 1 }
]);
G.Art.strokeField(ctx, 0, 0, W, H, ['#27408b', '#3f5fa3', '#5c7fc0', '#16224e', '#f5d76e'],
  { n: 2200, len: 34, width: 4, angleFn: af, rnd: rnd, alpha: 0.8, jitter: 0.3 });
G.Art.star(ctx, W * 0.55, H * 0.13, 10, rnd);
G.Art.star(ctx, W * 0.94, H * 0.18, 8, rnd);
G.Art.star(ctx, W * 0.47, H * 0.86, 7, rnd);

/* retrato EN PROCESO: solo algunas piezas; el resto, niebla con grietas */
const port = G.Sprites.selfPortrait();          /* 360x480 */
const wip = document.createElement('canvas');
wip.width = 360; wip.height = 480;
const wctx = wip.getContext('2d');
const PC = 3, PR = 4, pw = 120, ph = 120;
const visibles = { '1,0': 1, '0,1': 1, '1,1': 1, '2,1': 1, '1,2': 1, '0,3': 1 };
for (let r = 0; r < PR; r++) {
  for (let c = 0; c < PC; c++) {
    if (visibles[c + ',' + r]) {
      wctx.drawImage(port, c * pw, r * ph, pw, ph, c * pw, r * ph, pw, ph);
    } else {
      wctx.drawImage(G.Sprites.fogTexture(pw, ph, r * 7 + c * 3 + 2), c * pw, r * ph);
    }
  }
}
/* grietas oscuras (todavía no doradas: eso se gana jugando) */
wctx.strokeStyle = 'rgba(12,16,38,.85)'; wctx.lineWidth = 2;
for (let c = 1; c < PC; c++) { wctx.beginPath(); wctx.moveTo(c * pw, 0); wctx.lineTo(c * pw, 480); wctx.stroke(); }
for (let r = 1; r < PR; r++) { wctx.beginPath(); wctx.moveTo(0, r * ph); wctx.lineTo(360, r * ph); wctx.stroke(); }

const phh = 520, pww = phh * 360 / 480, px = 70, py = (H - phh) / 2;
ctx.save();
ctx.translate(px + pww / 2, py + phh / 2); ctx.rotate(-0.02);
ctx.fillStyle = '#3a2c12'; ctx.fillRect(-pww / 2 - 16, -phh / 2 - 16, pww + 32, phh + 32);
ctx.fillStyle = '#6b4a2a'; ctx.fillRect(-pww / 2 - 10, -phh / 2 - 10, pww + 20, phh + 20);
ctx.drawImage(wip, -pww / 2, -phh / 2, pww, phh);
ctx.restore();

/* texto */
ctx.fillStyle = '#f5d76e';
ctx.font = 'bold 150px Georgia';
ctx.shadowColor = 'rgba(241,196,15,.45)'; ctx.shadowBlur = 26;
ctx.fillText('ESLI', 540, 225);
ctx.shadowBlur = 0;
ctx.fillStyle = '#f6ecd0';
ctx.font = 'italic 46px Georgia';
ctx.fillText('Las Piezas de Mí', 545, 292);
ctx.fillStyle = '#f5d76e';
ctx.font = 'italic 44px Georgia';
ctx.fillText('«Hazlo con miedo.»', 545, 388);
ctx.fillStyle = 'rgba(246,236,208,.9)';
ctx.font = '30px Georgia';
ctx.fillText('La Niebla Gris rompió tu retrato', 545, 455);
ctx.fillText('en doce pedazos. Ve por ellos.', 545, 495);
ctx.font = 'italic 24px Georgia';
ctx.fillStyle = 'rgba(246,236,208,.6)';
ctx.fillText('gratis · ligero · pintado a pinceladas', 545, 560);
</script>
</body>
</html>
